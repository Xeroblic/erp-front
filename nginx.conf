server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # Serve files, fallback to index.html for SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Example proxy for an API running on the host machine during development
  # Uncomment and adjust if you want nginx to proxy API requests
  # location /api/ {
  #   proxy_pass http://host.docker.internal:8000/;
  # }
}
