<!doctype html>
<html lang="es" dir="ltr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="color-scheme" content="dark light" />

        <!-- Favicon & PWA -->
        <link rel="icon" href="/favicon.ico" />
        <link rel="apple-touch-icon" href="/logo192.png" />
        <link rel="manifest" href="/manifest.json" />
        <meta name="theme-color" content="#18181b" />

        <!-- SEO básico -->
        <title>AxathERP | Plataforma Central de Gestión</title>
        <meta name="description" content="AxathERP es un ERP modular para la gestión centralizada de empresas, ventas, soporte técnico y operaciones." />

        <!-- Performance hints -->
        <meta http-equiv="x-dns-prefetch-control" content="on" />
        <!-- Si usas Google Fonts, descomenta estas 2 líneas -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <!-- Preload de recursos probables -->
        <link rel="preload" as="image" href="/logo192.png" imagesizes="192x192" />

        <!-- iOS PWA -->
        <meta name="mobile-web-app-capable" content="yes">    
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />



    <!-- <meta http-equiv="Cache-Control" content="no-cache" /> -->
    </head>

    <body>
        <noscript>Debes habilitar JavaScript para ejecutar esta aplicación.</noscript>
        <div id="root"></div>
        <div id="portal-root"></div>

        <!-- Vite inyecta modulepreload automático para los chunks importados.
            Mantén el entrypoint en module para ES modules. -->
        <script type="module" src="/src/index.tsx"></script>
    </body>
</html>
