    <style id="critical-styles">
        /* RESET & BASE */
        :root {
            --bg-color: #0f172a; /* Slate 900 - Oscuro profundo */
            --primary: #3b82f6;  /* Blue 500 */
            --secondary: #6366f1; /* Indigo 500 */
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color); /* Previene flash blanco */
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden; /* Evita scroll durante la carga */
        }

        /* LAYOUT CENTRADO */
        .splash-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        .logo-container {
            width: 120px;
            height: 120px;
            position: relative;
            margin-bottom: 2rem;
            animation: float 6s ease-in-out infinite;
        }

        .duotone-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.3));
        }

        /* Caminos del SVG para animar */
        .path-primary { fill: var(--primary); opacity: 0.9; }
        .path-secondary { fill: var(--secondary); opacity: 0.6; }

        /* TEXTO Y BARRA */
        .loading-text {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #fff, #94a3b8);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.5s forwards;
        }

        .progress-bar-track {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 4px;
            animation: loadingMove 1.5s infinite ease-in-out;
        }

        /* ANIMACIONES */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes loadingMove {
            0% { left: -40%; width: 40%; }
            50% { width: 60%; }
            100% { left: 100%; width: 40%; }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* UTILS */
        .skip-link {
            position: absolute;
            top: -100px;
            left: 10px;
            background: var(--primary);
            color: white;
            padding: 10px 15px;
            z-index: 10000;
            text-decoration: none;
            font-weight: 600;
            border-radius: 4px;
        }
        .skip-link:focus { top: 10px; }
    </style>

<body>

                    <path d="M5 13L12 3L19 13H5Z" class="path-primary"/>
