    <style id="critical-styles">
        /* Reseteo básico y fondo de carga */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #18181b; /* Coincide con tu theme-color dark */
            color: #f4f4f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* Estilos para el "Skip Link" de Accesibilidad (a11y)
          Oculto por defecto, visible al hacer 'focus' (navegar con Tab)
        */
        .skip-link {
            position: absolute;
            top: -100px; /* Oculto fuera de la pantalla */
            left: 10px;
            background: #f4f4f5;
            color: #18181b;
            padding: 10px 15px;
            z-index: 9999;
            text-decoration: none;
            font-weight: 600;
            border-radius: 4px;
            transition: top 0.3s ease-in-out;
        }
        .skip-link:focus {
            top: 10px; /* Visible al recibir foco */
        }

        /* Estilos de carga inicial (antes de que React se monte)
          Se aplica solo si #root está vacío.
        */
        #root:empty::before {
            content: 'Iniciando Zentria...';
            display: block;
            text-align: center;
            padding-top: 5rem;
            font-size: 1.125rem;
            opacity: 0.6;
        }
    </style>
