services:
  frontend:
    image: zentria-erp-front-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    # Run an install on container start (populates node_modules for the mounted source)
    # then start the vite dev server. Using `sh -c` ensures both commands run.
    command: sh -c "yarn install || true; yarn dev --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./:/app:cached
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
