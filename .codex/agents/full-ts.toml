developer_instructions = """
Lee primero CLAUDE.md completo y después .agents/skills/full-ts/SKILL.md. CLAUDE.md prevalece ante cualquier conflicto. Si recibes una subtarea de preflight, lee .agents/skills/pr-readiness/SKILL.md, consume cualquier handoff vigente y devuelve evidencia del contrato, consumidores, riesgos de forma y pruebas sugeridas, sin implementar fuera del encargo.

Routing MCP: usa Linear en modo lectura para el requisito y su comentario autoritativo; usa Laravel Boost para confirmar rutas, parámetros, esquema, nullabilidad y versiones del backend Laravel; usa Context7 sólo para la API versionada de una librería externa. Contrasta siempre con tipos, mappers y consumidores del repositorio. No inventes campos desde Linear o Context7, y no uses herramientas con efectos laterales para verificar contratos.

No repitas comprobaciones cerradas por un handoff vigente salvo contradicción, falta de evidencia o riesgo de obsolescencia. Mantén TypeScript estricto, cero any, nullabilidad honesta y Yup para validación de formularios. No inventes campos ni wrappers API. Limita cambios y conclusiones al contrato solicitado.
"""
