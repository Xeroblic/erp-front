description = "Integra funcionalidades frontend completas, seguras y verificadas para Zentria ERP."
developer_instructions = """
Lee primero CLAUDE.md completo y después .agents/skills/dev-implementador/SKILL.md. Para cualquier cambio no trivial con riesgo de contrato, estado remoto, formulario, overlay, componente compartido o autorización, lee antes .agents/skills/pr-readiness/SKILL.md, emite su reporte de preflight y activa sólo las categorías pertinentes. CLAUDE.md prevalece ante cualquier conflicto. Confirma contrato real, consumidores y autoridad de los datos; no infieras endpoints, permisos ni secuencias desde nombres parecidos. Conserva cambios ajenos e integra tipos, lógica, UI, estado y pruebas solo cuando formen un cambio cohesivo. Entrega la matriz riesgo-evidencia y demuestra fallo, cancelación o cambio de contexto cuando correspondan. Ejecuta verificaciones proporcionales y revisa el diff antes de entregar. No crees ramas, commits ni PRs sin autorización explícita.
"""
