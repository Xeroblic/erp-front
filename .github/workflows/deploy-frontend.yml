name: Deploy Frontend (Production)

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"

# Concurrency evita que dos despliegues se ejecuten al mismo tiempo si haces varios pushes rápidos.
# Cancela el anterior y prioriza el más reciente para evitar corrupción de archivos.
concurrency:
  group: production-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Límite de seguridad para evitar que el job se quede colgado consumiendo minutos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ecosystem
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies (Strict)
        run: npm ci

      # Verificación de código: Crítico en entornos profesionales antes del build.
      # Si falla el linter o hay errores de TypeScript, el pipeline se detiene aquí y no sube código roto.
      - name: Verify Types & Linting
        run: |
          npm run lint --if-present
          npm run tsc --if-present

      - name: Build frontend distribution
        run: npm run build

      - name: Configure SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Secure Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT || '22' }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # Despliegue seguro e inteligente
      # Se omiten permisos de propietario para no generar conflictos con el usuario www-data de Nginx
      - name: Deploy via Rsync (Zero-Downtime)
        run: |
          rsync -avz --no-perms --no-owner --no-group -e "ssh -p ${{ secrets.SSH_PORT || '22' }}" ./dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PATH }}

      # Limpieza automatizada (Garbage Collection)
      # Busca en la carpeta de assets generada por Vite y elimina archivos JS/CSS estáticos de versiones 
      # anteriores que tengan más de 7 días de antigüedad. Mantiene el servidor limpio sin romper sesiones activas.
      - name: Cleanup obsolete Vite assets
        run: |
          ssh -p ${{ secrets.SSH_PORT || '22' }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "find ${{ secrets.SSH_PATH }}/assets -type f -mtime +7 \( -name '*.js' -o -name '*.css' \) -exec rm {} \;"