name: Style Quality

on:
    pull_request:

concurrency:
    group: style-quality-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    style-quality:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22.x'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check line endings
              run: pnpm run check:eol

            - name: Check Prettier
              if: always()
              run: pnpm run prettier:check

            - name: Check import extensions
              if: always()
              run: pnpm run lint:imports
