name: Calidad de PR

on:
    pull_request:

concurrency:
    group: style-quality-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    style-quality:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22.x'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check line endings
              run: pnpm run check:eol

            - name: Check Prettier
              if: ${{ !cancelled() }}
              run: pnpm run prettier:check

            - name: Check import extensions
              if: ${{ !cancelled() }}
              run: pnpm run lint:imports

            - name: Typecheck
              if: ${{ !cancelled() }}
              run: pnpm run typecheck

    # Las pruebas corren en su propio job, en paralelo con el de estilo, y repartidas en
    # shards. El runner de un repo privado tiene 2 vCPU y Vitest usa por defecto
    # `núcleos - 1` workers: sin `--maxWorkers=2` cada shard correría con uno solo.
    tests:
        name: tests (${{ matrix.shard }}/3)
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22.x'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Tests
              run: pnpm exec vitest run --shard=${{ matrix.shard }}/3 --maxWorkers=2
